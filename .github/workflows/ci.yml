# Typecheck and test on every push to main and every pull request, then pack the
# app and start the packed archive, so a release can never be the first time a
# bundle of this tree is built.
#
# Node is pinned to the floor `engines` promises (26.10.0, the first node with
# --vfs-load), so a newer API cannot creep in unnoticed, and a red run means this
# repository changed rather than a release moving underneath it.
#
# Linux and Windows run the tests: the app launches Chrome and watches files, and
# both behave differently on Windows. The browser tests drive the Chrome that
# GitHub's runners come with.
#
# Every action is pinned to a full commit SHA: a tag is a mutable pointer.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: 'test · linux · node 26.10.0' }
          - { os: windows-latest, name: 'test · windows · node 26.10.0' }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'

      - name: Install dependencies
        run: npm install

      # Typecheck (node and page), unit tests, server tests, and the app in a
      # headless browser against a mock AI server.
      - name: Test
        run: npm test

  package:
    name: package · linux
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'

      - name: Install dependencies
        run: npm install

      # The file list, then the unsigned archive built from it.
      - name: Pack
        run: npm run package

      # Start the packed app headless on the example project. The page only
      # reports that it loaded once every module it and the server import was
      # found inside the archive, so this is what proves the file list complete.
      - name: Smoke test the archive
        run: npm run smoke

      - name: Keep the unsigned archive with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bled-unsigned
          path: |
            build/bled.run
            build/bled.manifest
